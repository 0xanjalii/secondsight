<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="SecondSight — Intelligent visual companion guiding steps, reading the world, and speaking with natural voice." />
    
    <title>SecondSight — Intelligent Visual Companion</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS with custom theme configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              paper: '#ffffff',
              offwhite: '#f9f9fb',
              subtle: '#f2f2f5',
              darkcard: '#ffffff',
              darkborder: '#000000',
              mutedzinc: '#52525b',
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            borderRadius: {
              DEFAULT: '0px',
              none: '0px',
              sm: '0px',
              md: '0px',
              lg: '0px',
              xl: '0px',
              '2xl': '0px',
              '3xl': '0px',
              full: '0px',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'sonar': 'sonar 2s cubic-bezier(0, 0.2, 0.8, 1) infinite',
              'scanline': 'scanline 3s linear infinite',
              'wave-bar': 'waveBar 1.2s ease-in-out infinite',
            },
            keyframes: {
              sonar: {
                '0%': { transform: 'scale(0.8)', opacity: '0.9' },
                '100%': { transform: 'scale(2.2)', opacity: '0' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(1000%)' },
              },
              waveBar: {
                '0%, 100%': { height: '12%' },
                '50%': { height: '100%' },
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-white text-black selection:bg-black selection:text-white antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
